<!DOCTYPE html>
<html lang="uz" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TeleAI — Sun'iy Intellekt Chat</title>
    <!-- Inter shrifti -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
                    },
                    colors: {
                        tg: {
                            blue: '#3390ec',
                            blueHover: '#2b7fd4',
                            darkBg: '#0e1621',
                            darkSidebar: '#17212b',
                            darkHeader: '#17212b',
                            darkHover: '#202b36',
                            darkActive: '#2b5278',
                            darkBubbleIn: '#182533',
                            darkBubbleOut: '#2b5278',
                            lightBubbleOut: '#effdde',
                            lightActive: '#3390ec',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        /* Asosiy shrift va balandlik sozlamalari */
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        /* Telegram uslubidagi yumshoq naqshli chat foni (Light rejim) */
        .tg-chat-bg {
            background-color: #c8dec4;
            background-image:
                radial-gradient(circle at 20% 20%, rgba(255, 255, 255, 0.35) 0%, transparent 45%),
                radial-gradient(circle at 80% 80%, rgba(162, 207, 174, 0.45) 0%, transparent 50%),
                url("data:image/svg+xml,%3Csvg width='120' height='120' viewBox='0 0 120 120' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' stroke='%235b8a62' stroke-width='1.2' stroke-opacity='0.14'%3E%3Cpath d='M18 22l8-4-3 9-5-5z'/%3E%3Ccircle cx='65' cy='24' r='6'/%3E%3Cpath d='M98 18c4 0 7 3 7 7s-3 7-7 7-7-3-7-7'/%3E%3Cpath d='M24 68c0-5 4-9 9-9s9 4 9 9-4 9-9 9'/%3E%3Cpath d='M62 64l10 6-10 6z'/%3E%3Crect x='92' y='60' width='12' height='12' rx='3'/%3E%3Cpath d='M16 102l6-8 6 8z'/%3E%3Ccircle cx='60' cy='102' r='4'/%3E%3Cpath d='M94 98l12 8M106 98l-12 8'/%3E%3C/g%3E%3C/svg%3E");
        }

        /* Telegram uslubidagi yumshoq naqshli chat foni (Dark rejim) */
        .dark .tg-chat-bg {
            background-color: #0e1621;
            background-image:
                radial-gradient(circle at 15% 25%, rgba(43, 82, 120, 0.22) 0%, transparent 45%),
                radial-gradient(circle at 85% 75%, rgba(24, 37, 51, 0.4) 0%, transparent 50%),
                url("data:image/svg+xml,%3Csvg width='120' height='120' viewBox='0 0 120 120' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' stroke='%236c8eae' stroke-width='1.2' stroke-opacity='0.09'%3E%3Cpath d='M18 22l8-4-3 9-5-5z'/%3E%3Ccircle cx='65' cy='24' r='6'/%3E%3Cpath d='M98 18c4 0 7 3 7 7s-3 7-7 7-7-3-7-7'/%3E%3Cpath d='M24 68c0-5 4-9 9-9s9 4 9 9-4 9-9 9'/%3E%3Cpath d='M62 64l10 6-10 6z'/%3E%3Crect x='92' y='60' width='12' height='12' rx='3'/%3E%3Cpath d='M16 102l6-8 6 8z'/%3E%3Ccircle cx='60' cy='102' r='4'/%3E%3Cpath d='M94 98l12 8M106 98l-12 8'/%3E%3C/g%3E%3C/svg%3E");
        }

        /* Maxsus ingichka skrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(120, 130, 140, 0.35);
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(120, 130, 140, 0.55);
        }

        /* Yozmoqda... 3 nuqta animatsiyasi */
        @keyframes tgBounce {
            0%, 80%, 100% {
                transform: scale(0.6);
                opacity: 0.4;
            }
            40% {
                transform: scale(1);
                opacity: 1;
            }
        }
        .typing-dot {
            animation: tgBounce 1.3s infinite ease-in-out both;
        }
        .typing-dot:nth-child(1) { animation-delay: -0.32s; }
        .typing-dot:nth-child(2) { animation-delay: -0.16s; }
        .typing-dot:nth-child(3) { animation-delay: 0s; }

        /* Xabar chiqish animatsiyasi */
        @keyframes msgPop {
            from {
                opacity: 0;
                transform: translateY(8px) scale(0.98);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
        .msg-animate {
            animation: msgPop 0.2s ease-out forwards;
        }

        /* Markdown kontenti uchun stillar */
        .md-content p {
            margin-bottom: 0.5rem;
            line-height: 1.55;
        }
        .md-content p:last-child {
            margin-bottom: 0;
        }
        .md-content h1, .md-content h2, .md-content h3 {
            font-weight: 700;
            margin-top: 0.75rem;
            margin-bottom: 0.4rem;
            line-height: 1.3;
        }
        .md-content h1 { font-size: 1.15rem; }
        .md-content h2 { font-size: 1.05rem; }
        .md-content h3 { font-size: 0.98rem; }
        .md-content ul {
            list-style-type: disc;
            padding-left: 1.35rem;
            margin-bottom: 0.55rem;
        }
        .md-content ol {
            list-style-type: decimal;
            padding-left: 1.35rem;
            margin-bottom: 0.55rem;
        }
        .md-content li {
            margin-bottom: 0.25rem;
            line-height: 1.5;
        }
        .md-content blockquote {
            border-left: 3px solid #3390ec;
            padding-left: 0.75rem;
            margin: 0.5rem 0;
            opacity: 0.9;
            font-style: italic;
        }
        .md-content a {
            color: #3390ec;
            text-decoration: underline;
            word-break: break-all;
        }
        .dark .md-content a {
            color: #6ab3f3;
        }
        .md-content code.inline-code {
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 0.85em;
            padding: 0.12rem 0.35rem;
            border-radius: 0.35rem;
            background-color: rgba(51, 144, 236, 0.12);
            color: #1d6ec2;
        }
        .dark .md-content code.inline-code {
            background-color: rgba(106, 179, 243, 0.16);
            color: #8cc8ff;
        }
        .md-content pre {
            overflow-x: auto;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 0.83rem;
            line-height: 1.5;
        }
    </style>
</head>
<body class="bg-white dark:bg-tg-darkBg text-slate-900 dark:text-slate-100 overflow-hidden select-none sm:select-auto">

    <!-- Asosiy ilova konteyneri -->
    <div id="app" class="h-[100dvh] w-full flex overflow-hidden relative">

        <!-- ================= CHAP PANEL (SIDEBAR) ================= -->
        <aside id="sidebar" class="w-full md:w-[340px] lg:w-[380px] flex-shrink-0 flex flex-col bg-white dark:bg-tg-darkSidebar border-r border-slate-200 dark:border-slate-800/80 z-20 transition-all duration-200">

            <!-- Sidebar Sarlavha -->
            <div class="px-4 py-3 flex items-center justify-between gap-2 border-b border-slate-100 dark:border-slate-800/70">
                <div class="flex items-center gap-2.5">
                    <div class="w-9 h-9 rounded-full bg-gradient-to-tr from-[#229ED9] to-[#3390ec] flex items-center justify-center text-white shadow-sm">
                        <!-- Telegram qog'oz samolyotcha ikonkasi -->
                        <svg class="w-5 h-5 -ml-0.5" fill="currentColor" viewBox="0 0 24 24">
                            <path d="M21.94 3.46a1.15 1.15 0 0 0-1.2-.16L2.88 10.67a1.15 1.15 0 0 0 .08 2.15l4.46 1.52 1.72 5.37a1.15 1.15 0 0 0 1.88.49l2.63-2.5 4.65 3.43a1.15 1.15 0 0 0 1.81-.68l3.01-15.65a1.15 1.15 0 0 0-.18-1.34zM9.7 14.43l7.68-6.48-5.94 7.7-.24 2.84-1.5-4.06z"/>
                        </svg>
                    </div>
                    <div>
                        <h1 class="font-bold text-base leading-tight tracking-tight">TeleAI</h1>
                        <p class="text-[11px] text-slate-500 dark:text-slate-400">Universal Sun'iy Intellekt</p>
                    </div>
                </div>

                <!-- Yangi chat tugmasi -->
                <button id="newChatBtn" title="Yangi chat boshlash" class="flex items-center gap-1.5 px-3 py-2 rounded-full bg-tg-blue hover:bg-tg-blueHover active:scale-95 text-white text-xs font-semibold shadow-sm transition cursor-pointer">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.3" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15"/>
                    </svg>
                    <span>Yangi chat</span>
                </button>
            </div>

            <!-- Qidiruv maydoni -->
            <div class="px-3 py-2.5">
                <div class="relative flex items-center">
                    <svg class="w-4 h-4 text-slate-400 absolute left-3.5 pointer-events-none" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-4.35-4.35m0 0A7.5 7.5 0 105.65 5.65a7.5 7.5 0 0010.6 10.6z"/>
                    </svg>
                    <input id="searchInput" type="text" placeholder="Chatlarni qidirish..." class="w-full pl-10 pr-8 py-2 text-sm rounded-full bg-slate-100 dark:bg-[#242f3d] text-slate-800 dark:text-slate-100 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-tg-blue/60 transition">
                    <button id="clearSearchBtn" class="hidden absolute right-2.5 p-1 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 cursor-pointer" title="Tozalash">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
                        </svg>
                    </button>
                </div>
            </div>

            <!-- Chatlar ro'yxati -->
            <div id="chatList" class="flex-1 overflow-y-auto px-2 pb-3 space-y-1">
                <!-- JS orqali dinamik to'ldiriladi -->
            </div>

            <!-- Sidebar pastki ma'lumot -->
            <div class="px-4 py-2.5 border-t border-slate-100 dark:border-slate-800/70 flex items-center justify-between text-[11px] text-slate-400 dark:text-slate-500">
                <span>Gemini AI • O'zbek tili</span>
                <span id="chatCountBadge">1 ta chat</span>
            </div>
        </aside>

        <!-- ================= ASOSIY CHAT OYNASI ================= -->
        <main id="chatArea" class="flex-1 flex flex-col min-w-0 h-full relative">

            <!-- Chat Sarlavhasi (Header) -->
            <header class="h-[60px] px-3 sm:px-4 bg-white dark:bg-tg-darkHeader border-b border-slate-200 dark:border-slate-800/80 flex items-center justify-between gap-2 z-10 flex-shrink-0">
                <div class="flex items-center gap-2.5 min-w-0">
                    <!-- Mobil orqaga qaytish tugmasi -->
                    <button id="mobileBackBtn" class="md:hidden p-2 -ml-1 rounded-full hover:bg-slate-100 dark:hover:bg-tg-darkHover text-slate-600 dark:text-slate-300 transition cursor-pointer" title="Chatlar ro'yxati">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/>
                        </svg>
                    </button>

                    <!-- AI Avatari -->
                    <div id="headerAvatar" class="w-10 h-10 rounded-full bg-gradient-to-br from-sky-400 to-blue-600 flex items-center justify-center text-white font-bold text-sm flex-shrink-0 shadow-sm relative">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M9.813 15.904L9 18.75l-.813-2.846a4.5 4.5 0 00-3.09-3.09L2.25 12l2.846-.813a4.5 4.5 0 003.09-3.09L9 5.25l.813 2.846a4.5 4.5 0 003.09 3.09L15.75 12l-2.846.813a4.5 4.5 0 00-3.09 3.09z"/>
                        </svg>
                        <span class="absolute bottom-0 right-0 w-2.5 h-2.5 rounded-full bg-emerald-500 ring-2 ring-white dark:ring-tg-darkHeader"></span>
                    </div>

                    <!-- Chat nomi va status -->
                    <div class="min-w-0">
                        <h2 id="headerTitle" class="font-semibold text-[15px] leading-tight truncate text-slate-900 dark:text-white">
                            AI Yordamchi (Universal)
                        </h2>
                        <div id="headerStatus" class="text-xs text-tg-blue dark:text-sky-400 font-medium flex items-center gap-1 mt-0.5">
                            <span>online</span>
                        </div>
                    </div>
                </div>

                <!-- O'ng tomon boshqaruv tugmalari -->
                <div class="flex items-center gap-1 sm:gap-1.5 flex-shrink-0">
                    <!-- Internetdan qidirish (Google Search Grounding) tugmasi -->
                    <button id="webSearchToggle" class="flex items-center gap-1.5 px-2.5 py-1.5 rounded-full text-xs font-medium border transition cursor-pointer" title="Internetdan dolzarb ma'lumot qidirishni yoqish/o'chirish">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M12 21a9 9 0 100-18 9 9 0 000 18zM3.6 9h16.8M3.6 15h16.8M12 3a14.5 14.5 0 010 18M12 3a14.5 14.5 0 000 18"/>
                        </svg>
                        <span class="hidden sm:inline">Internet</span>
                    </button>

                    <!-- Kun / Tun rejimi tugmasi -->
                    <button id="themeToggleBtn" class="p-2.5 rounded-full hover:bg-slate-100 dark:hover:bg-tg-darkHover text-slate-600 dark:text-slate-300 transition cursor-pointer" title="Kun/Tun rejimi">
                        <!-- Quyosh (Dark rejimda ko'rinadi) -->
                        <svg id="sunIcon" class="w-5 h-5 hidden dark:block" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1.5M12 19.5V21M4.22 4.22l1.06 1.06M18.72 18.72l1.06 1.06M3 12h1.5M19.5 12H21M4.22 19.78l1.06-1.06M18.72 5.28l1.06-1.06M12 7.5a4.5 4.5 0 100 9 4.5 4.5 0 000-9z"/>
                        </svg>
                        <!-- Oy (Light rejimda ko'rinadi) -->
                        <svg id="moonIcon" class="w-5 h-5 block dark:hidden" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M21 12.79A9 9 0 1111.21 3a7 7 0 009.79 9.79z"/>
                        </svg>
                    </button>

                    <!-- Chatni tozalash tugmasi -->
                    <button id="clearChatBtn" class="p-2.5 rounded-full hover:bg-red-50 dark:hover:bg-red-900/20 text-slate-500 hover:text-red-500 dark:text-slate-400 dark:hover:text-red-400 transition cursor-pointer" title="Chat tarixini tozalash">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
                        </svg>
                    </button>
                </div>
            </header>

            <!-- Xabarlar maydoni (Telegram naqshli foni) -->
            <div id="messagesContainer" class="flex-1 overflow-y-auto tg-chat-bg px-3 sm:px-6 py-4 scroll-smooth">
                <div id="messagesInner" class="max-w-3xl mx-auto flex flex-col gap-2.5 min-h-full">
                    <!-- JS orqali xabarlar yoki boshlang'ich takliflar chiqariladi -->
                </div>
            </div>

            <!-- Pastki xabar yozish paneli -->
            <footer class="bg-white dark:bg-tg-darkHeader border-t border-slate-200 dark:border-slate-800/80 px-3 sm:px-5 py-2.5 flex-shrink-0">
                <div class="max-w-3xl mx-auto flex items-end gap-2 sm:gap-3">
                    <!-- Matn kiritish qutisi -->
                    <div class="flex-1 bg-slate-100 dark:bg-[#242f3d] rounded-3xl px-4 py-2 flex items-center border border-transparent focus-within:border-tg-blue/50 transition">
                        <textarea
                            id="messageInput"
                            rows="1"
                            placeholder="Xabar yozing... (Istalgan savolingizni bering)"
                            class="w-full bg-transparent text-sm sm:text-[15px] text-slate-900 dark:text-slate-100 placeholder-slate-400 dark:placeholder-slate-400 resize-none focus:outline-none max-h-36 leading-relaxed py-0.5"
                        ></textarea>
                    </div>

                    <!-- Telegram uslubidagi Send tugmasi -->
                    <button
                        id="sendBtn"
                        class="w-11 h-11 rounded-full bg-tg-blue hover:bg-tg-blueHover active:scale-95 disabled:opacity-50 disabled:cursor-not-allowed text-white flex items-center justify-center flex-shrink-0 shadow-md transition cursor-pointer"
                        title="Yuborish (Enter)"
                    >
                        <svg id="sendIcon" class="w-5 h-5 translate-x-[1px]" fill="currentColor" viewBox="0 0 24 24">
                            <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
                        </svg>
                        <svg id="sendSpinner" class="w-5 h-5 animate-spin hidden" fill="none" viewBox="0 0 24 24">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3"></circle>
                            <path class="opacity-90" fill="currentColor" d="M4 12a8 8 0 018-8v3a5 5 0 00-5 5H4z"></path>
                        </svg>
                    </button>
                </div>
                <p class="max-w-3xl mx-auto text-[11px] text-center text-slate-400 dark:text-slate-500 mt-1.5 hidden sm:block">
                    Yuborish uchun <kbd class="px-1.5 py-0.5 rounded bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 font-mono text-[10px]">Enter</kbd>, yangi qator uchun <kbd class="px-1.5 py-0.5 rounded bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 font-mono text-[10px]">Shift + Enter</kbd> bosing.
                </p>
            </footer>
        </main>
    </div>

    <!-- ================= TASDIQLASH MODALI (confirm() o'rniga) ================= -->
    <div id="confirmModal" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/50 backdrop-blur-[2px] p-4">
        <div class="bg-white dark:bg-tg-darkSidebar w-full max-w-sm rounded-2xl shadow-2xl border border-slate-200 dark:border-slate-700/70 p-5 transform transition-all">
            <h3 id="modalTitle" class="text-base font-bold text-slate-900 dark:text-white mb-2">Tasdiqlash</h3>
            <p id="modalDesc" class="text-sm text-slate-600 dark:text-slate-300 mb-5 leading-relaxed">Ushbu amalni bajarishni xohlaysizmi?</p>
            <div class="flex items-center justify-end gap-2">
                <button id="modalCancelBtn" class="px-4 py-2 rounded-xl text-sm font-medium text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-tg-darkHover transition cursor-pointer">
                    Bekor qilish
                </button>
                <button id="modalConfirmBtn" class="px-4 py-2 rounded-xl text-sm font-semibold bg-red-500 hover:bg-red-600 text-white shadow-sm transition cursor-pointer">
                    Tasdiqlash
                </button>
            </div>
        </div>
    </div>

    <!-- ================= TOAST XABARNOMA ================= -->
    <div id="toast" class="fixed bottom-20 left-1/2 -translate-x-1/2 z-50 px-4 py-2.5 rounded-full bg-slate-900/90 dark:bg-slate-100/95 text-white dark:text-slate-900 text-xs sm:text-sm font-medium shadow-lg pointer-events-none opacity-0 translate-y-3 transition-all duration-200 flex items-center gap-2">
        <span id="toastText">Nusxalandi!</span>
    </div>

    <!-- ================= JAVASCRIPT MANTIQI ================= -->
    <script>
        /**
         * TeleAI — Telegram Web uslubidagi AI Chat ilovasi
         * Gemini 3 Flash Preview API bilan ishlaydi.
         */

        // --- KONSTANTALAR VA SOZLAMALAR ---
        const apiKey = ""; // Runtime muhiti avtomatik kalitni taqdim etadi
        const GEMINI_MODEL = "gemini-3-flash-preview";
        const STORAGE_KEYS = {
            CHATS: "teleai_chats_v1",
            ACTIVE_ID: "teleai_active_chat_id_v1",
            THEME: "teleai_theme_v1",
            WEB_SEARCH: "teleai_web_search_v1"
        };

        // AI tizim ko'rsatmasi (System Instruction)
        const SYSTEM_INSTRUCTION = `Sen TeleAI — Telegram uslubidagi universal, bilimli, tezkor va amaliy sun'iy intellekt yordamchisan.
Sening vazifang:
1. Foydalanuvchining har qanday sohadagi (ilm-fan, dasturlash, matematika, tarix, biznes, kundalik hayot, tarjima, ta'lim, sog'lom turmush, texnologiya va boshqalar) savollariga aniq, amaliy, tushunarli va foydali javob berish.
2. Foydalanuvchi qaysi tilda yozsa (asosan O'zbek tilida), aynan shu tilda ravon, tabiiy va savodli javob qaytarish.
3. Javoblarni o'qishga qulay bo'lishi uchun Markdown formatlashdan (qalin matn, ro'yxatlar, kerak bo'lganda kod bloklari) o'rinli foydalanish.
4. Dasturlash savollarida to'liq va tushunarli kod namunalari berish.
5. Muloyim, samimiy va do'stona muloqot qilish.`;

        // Yangi chat uchun tezkor amaliy savol namunalari
        const QUICK_PROMPTS = [
            {
                icon: "🐍",
                title: "Python o'rganish",
                text: "Python dasturlash tilini qanday o'rganaman?"
            },
            {
                icon: "☀️",
                title: "Kun tartibi",
                text: "Sog'lom kun tartibi tuzib ber"
            },
            {
                icon: "⚛️",
                title: "Kvant fizikasi",

        // --- YORDAMCHI FUNKSIYALAR ---
        function generateId() {

        function formatTime(isoString) {

        function formatChatListTime(isoString) {

                return date.toLocaleDateString("uz-UZ", { day: "2-digit", month: "2-digit" });
            } catch {

        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, "&amp;")

                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");

        // Matnni buferga nusxalash (iFrame-xavfsiz execCommand usuli)
        function copyToClipboard(text, successMsg = "Matn nusxalandi!") {
            try {
                const textarea = document.createElement("textarea");
                textarea.value = text;
                textarea.style.position = "fixed";
                textarea.style.left = "-9999px";
                textarea.style.top = "0";
                document.body.appendChild(textarea);
                textarea.focus();
                textarea.select();
                const copied = document.execCommand("copy");
                document.body.removeChild(textarea);
                if (copied) {
                    showToast(successMsg);
                } else {
                    showToast("Nusxalab bo'lmadi");
                }
            } catch (err) {
                showToast("Nusxalashda xatolik yuz berdi");

        // --- MARKDOWN PARSER (XAVFSIZ VA KOD BLOKLARI BILAN) ---
        function renderMarkdown(rawText) {
            if (!rawText) return "";

            // 1. Kod bloklarini (```lang ... ```) vaqtincha ajratib olish
            const codeBlocks = [];
            let text = rawText.replace(/```(\w*)\n?([\s\S]*?)```/g, (_, lang, code) => {
                const idx = codeBlocks.length;
                const cleanLang = (lang || "kod").trim();
                const cleanCode = code.replace(/\n$/, "");
                codeBlocks.push({ lang: cleanLang, code: cleanCode });
                return `%%CODEBLOCK_${idx}%%`;
            });

            // 2. HTML belgilarni xavfsizlantirish
            text = escapeHtml(text);

            // 3. Inline kod (`...`)
            const inlineCodes = [];
            text = text.replace(/`([^`\n]+)`/g, (_, code) => {
                const idx = inlineCodes.length;
                inlineCodes.push(code);
                return `%%INLINECODE_${idx}%%`;
            });

            // 4. Qatorlar bo'yicha sarlavha, ro'yxat va iqtiboslarni qayta ishlash
            const lines = text.split("\n");
            let htmlLines = [];
            let inUl = false;
            let inOl = false;

            const closeLists = () => {
                if (inUl) { htmlLines.push("</ul>"); inUl = false; }
                if (inOl) { htmlLines.push("</ol>"); inOl = false; }
            };

            for (let i = 0; i < lines.length; i++) {
                let line = lines[i];

                // Kod bloki joyi
                if (/^%%CODEBLOCK_\d+%%$/.test(line.trim())) {
                    closeLists();
                    htmlLines.push(line.trim());
                    continue;
                }

                // Sarlavhalar (#, ##, ###)
                if (/^###\s+(.+)$/.test(line)) {
                    closeLists();
                    htmlLines.push(`<h3>${formatInline(line.replace(/^###\s+/, ""))}</h3>`);
                    continue;
                }
                if (/^##\s+(.+)$/.test(line)) {
                    closeLists();
                    htmlLines.push(`<h2>${formatInline(line.replace(/^##\s+/, ""))}</h2>`);
                    continue;
                }
                if (/^#\s+(.+)$/.test(line)) {
                    closeLists();
                    htmlLines.push(`<h1>${formatInline(line.replace(/^#\s+/, ""))}</h1>`);
                    continue;
                }

                // Iqtibos (>)
                if (/^&gt;\s?(.+)$/.test(line)) {
                    closeLists();
                    htmlLines.push(`<blockquote>${formatInline(line.replace(/^&gt;\s?/, ""))}</blockquote>`);
                    continue;
                }

                // Belgili ro'yxat (- yoki *)
                if (/^\s*[-*•]\s+(.+)$/.test(line)) {
                    if (inOl) { htmlLines.push("</ol>"); inOl = false; }
                    if (!inUl) { htmlLines.push("<ul>"); inUl = true; }
                    htmlLines.push(`<li>${formatInline(line.replace(/^\s*[-*•]\s+/, ""))}</li>`);
                    continue;
                }

                // Raqamli ro'yxat (1. 2.)
                if (/^\s*\d+\.\s+(.+)$/.test(line)) {
                    if (inUl) { htmlLines.push("</ul>"); inUl = false; }
                    if (!inOl) { htmlLines.push("<ol>"); inOl = true; }
                    htmlLines.push(`<li>${formatInline(line.replace(/^\s*\d+\.\s+/, ""))}</li>`);
                    continue;
                }

                // Bo'sh qator
                if (line.trim() === "") {
                    closeLists();
                    continue;
                }

                // Oddiy paragraf
                closeLists();
                htmlLines.push(`<p>${formatInline(line)}</p>`);
            }
            closeLists();

            let result = htmlLines.join("");

            // 5. Inline kodlarni qayta joylash
            result = result.replace(/%%INLINECODE_(\d+)%%/g, (_, idx) => {
                return `<code class="inline-code">${inlineCodes[idx]}</code>`;
            });

            // 6. Kod bloklarini chiroyli nusxalash tugmasi bilan qayta joylash
            result = result.replace(/%%CODEBLOCK_(\d+)%%/g, (_, idx) => {
                const block = codeBlocks[idx];
                const encodedForCopy = encodeURIComponent(block.code);
                return `
                    <div class="my-2.5 rounded-xl overflow-hidden border border-slate-200 dark:border-slate-700/80 bg-[#1e293b] text-slate-100 shadow-sm">
                        <div class="flex items-center justify-between px-3 py-1.5 bg-[#0f172a] text-xs text-slate-300 border-b border-slate-700/60">
                            <span class="font-mono uppercase tracking-wider text-[11px] text-sky-400">${escapeHtml(block.lang)}</span>
                            <button
                                type="button"
                                onclick="copyCodeBlock(this, '${encodedForCopy}')"
                                class="flex items-center gap-1 px-2 py-0.5 rounded-md hover:bg-slate-700/80 text-slate-300 hover:text-white transition cursor-pointer text-[11px]"
                            >
                                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/>
                                </svg>
                                <span>Nusxalash</span>
                            </button>
                        </div>
                        <pre class="p-3 m-0 overflow-x-auto"><code>${escapeHtml(block.code)}</code></pre>
                    </div>
                `;
            });

            return result;
        }

        function formatInline(text) {
            // Havolalar [matn](url)
            text = text.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
            // Qalin matn **...**
            text = text.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
            // Kursiv *...*
            text = text.replace(/(?<!\*)\*([^*]+)\*(?!\*)/g, "<em>$1</em>");
            // Chizilgan ~~...~~
            text = text.replace(/~~([^~]+)~~/g, "<del>$1</del>");
            return text;
        }

        // Global kod nusxalash funksiyasi
        window.copyCodeBlock = function(btnEl, encodedCode) {
            const decoded = decodeURIComponent(encodedCode);
            copyToClipboard(decoded, "Kod nusxalandi!");
            const label = btnEl.querySelector("span");
            if (label) {
                const oldText = label.textContent;
                label.textContent = "Nusxalandi ✓";
                setTimeout(() => { label.textContent = oldText; }, 1600);
            }
        };

        // --- LOCALSTORAGE BILAN ISHLASH ---
        function saveState() {
            try {
                localStorage.setItem(STORAGE_KEYS.CHATS, JSON.stringify(state.chats));
                localStorage.setItem(STORAGE_KEYS.ACTIVE_ID, state.activeChatId || "");
                localStorage.setItem(STORAGE_KEYS.THEME, state.theme);
                localStorage.setItem(STORAGE_KEYS.WEB_SEARCH, JSON.stringify(state.webSearch));
            } catch (e) {
                // Storage to'lgan bo'lsa jimgina o'tkazib yuborish
            }
        }

        function loadState() {
            try {
                const savedTheme = localStorage.getItem(STORAGE_KEYS.THEME);
                if (savedTheme === "dark" || savedTheme === "light") {
                    state.theme = savedTheme;
                } else if (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) {
                    state.theme = "dark";
                }

                const savedSearch = localStorage.getItem(STORAGE_KEYS.WEB_SEARCH);
                if (savedSearch !== null) {
                    state.webSearch = JSON.parse(savedSearch);
                }

                const savedChats = localStorage.getItem(STORAGE_KEYS.CHATS);
                if (savedChats) {
                    const parsed = JSON.parse(savedChats);
                    if (Array.isArray(parsed) && parsed.length > 0) {
                        state.chats = parsed;
                    }
                }

                const savedActiveId = localStorage.getItem(STORAGE_KEYS.ACTIVE_ID);
                if (savedActiveId && state.chats.some(c => c.id === savedActiveId)) {
                    state.activeChatId = savedActiveId;
                }
            } catch (e) {
                state.chats = [];
            }

            // Agar chatlar bo'sh bo'lsa, standart "AI Yordamchi (Universal)" chatini yaratish
            if (state.chats.length === 0) {
                const defaultChat = createChatObject("AI Yordamchi (Universal)", AVATAR_GRADIENTS[0]);
                state.chats.push(defaultChat);
                state.activeChatId = defaultChat.id;
                saveState();
            } else if (!state.activeChatId) {
                state.activeChatId = state.chats[0].id;
            }
        }

        function createChatObject(title = "Yangi suhbat", gradient = null) {
            const now = new Date().toISOString();
            const color = gradient || AVATAR_GRADIENTS[state.chats.length % AVATAR_GRADIENTS.length];
            return {
                id: generateId(),
                title,
                gradient: color,
                createdAt: now,
                updatedAt: now,
                messages: []
            };
        }

        function getActiveChat() {
            return state.chats.find(c => c.id === state.activeChatId) || state.chats[0];
        }

        // --- SIDEBAR CHATLAR RO'YXATINI CHIZISH ---

            const sortedChats = [...state.chats].sort((a, b) => new Date(b.updatedAt) - new Date(a.updatedAt));
            const filtered = sortedChats.filter(chat => {
                if (!query) return true;
                const inTitle = chat.title.toLowerCase().includes(query);
                const inMsgs = chat.messages.some(m => m.text.toLowerCase().includes(query));
                return inTitle || inMsgs;
            });

            els.chatCountBadge.textContent = `${state.chats.length} ta chat`;
            els.chatList.innerHTML = "";

            if (filtered.length === 0) {
                els.chatList.innerHTML = `
                    <div class="py-10 px-4 text-center text-sm text-slate-400 dark:text-slate-500">
                        <p class="mb-1 font-medium">Hech qanday chat topilmadi</p>
                        <p class="text-xs">Boshqa so'z bilan qidirib ko'ring</p>

            filtered.forEach(chat => {

                        <h3 class="text-lg font-bold text-slate-900 dark:text-white mb-1.5">Salom! Men TeleAI yordamchiman</h3>
                        <p class="text-xs sm:text-sm text-slate-600 dark:text-slate-300 mb-5 leading-relaxed">
                            Dasturlash, ilm-fan, tarix, tarjima, biznes yoki kundalik hayotga oid istalgan savolingizni bering — aniq va amaliy javob beraman.
                        </p>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5 text-left" id="quickPromptsGrid"></div>
                    </div>
                `;

                const grid = welcomeWrap.querySelector("#quickPromptsGrid");
                QUICK_PROMPTS.forEach(p => {
                    const btn = document.createElement("button");
                    btn.type = "button";
                    btn.className = "p-3 rounded-2xl bg-slate-50 hover:bg-sky-50 dark:bg-[#202b36] dark:hover:bg-[#283644] border border-slate-200/80 dark:border-slate-700/60 transition text-left flex items-start gap-2.5 cursor-pointer active:scale-[0.98]";
                    btn.innerHTML = `
                        <span class="text-lg leading-none mt-0.5">${p.icon}</span>
                        <div>
                            <div class="text-xs font-semibold text-tg-blue dark:text-sky-400 mb-0.5">${p.title}</div>
                            <div class="text-xs text-slate-700 dark:text-slate-200 leading-snug">${p.text}</div>
                        </div>
                    `;
                    btn.addEventListener("click", () => {
                        sendMessage(p.text);
                    });
                    grid.appendChild(btn);
                });

                els.messagesInner.appendChild(welcomeWrap);
                return;
            }

            // Barcha xabarlarni pufakcha ko'rinishida chizish
            chat.messages.forEach(msg => {
                const isUser = msg.role === "user";
                const row = document.createElement("div");
                row.className = `flex w-full msg-animate ${isUser ? "justify-end" : "justify-start"}`;

                if (isUser) {
                    row.innerHTML = `
                        <div class="max-w-[85%] sm:max-w-[75%] rounded-2xl rounded-br-sm px-3.5 py-2.5 bg-tg-lightBubbleOut dark:bg-tg-darkBubbleOut text-slate-900 dark:text-white shadow-sm">
                            <div class="text-sm sm:text-[15px] leading-relaxed whitespace-pre-wrap break-words">${escapeHtml(msg.text)}</div>
                            <div class="flex items-center justify-end gap-1 mt-1 -mb-0.5">
                                <span class="text-[10px] text-emerald-700/75 dark:text-sky-200/75">${formatTime(msg.timestamp)}</span>
                                <!-- Telegram ko'k qo'shaloq galochka (✓✓) -->
                                <svg class="w-4 h-4 text-[#3390ec] dark:text-sky-300" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M1.5 12.5l4.2 4.2L15 7.5"/>
                                    <path d="M8.5 12.5l4.2 4.2L22 7.5"/>
                                </svg>
                            </div>
                        </div>
                    `;
                } else {
                    const renderedHtml = renderMarkdown(msg.text);
                    let sourcesHtml = "";
                    if (msg.sources && msg.sources.length > 0) {
                        const links = msg.sources.slice(0, 4).map(s => `
                            <a href="${escapeHtml(s.uri)}" target="_blank" rel="noopener noreferrer" class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[11px] bg-slate-100 dark:bg-slate-800/90 text-tg-blue dark:text-sky-400 hover:underline max-w-[200px] truncate">
                                <svg class="w-3 h-3 flex-shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101"/>
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M10.172 13.828a4 4 0 015.656 0l4-4a4 4 0 10-5.656-5.656l-1.1 1.1"/>
                                </svg>
                                <span class="truncate">${escapeHtml(s.title)}</span>
                            </a>
                        `).join("");
                        sourcesHtml = `<div class="flex flex-wrap gap-1.5 mt-2.5 pt-2 border-t border-slate-100 dark:border-slate-700/60">${links}</div>`;
                    }

                    row.innerHTML = `
                        <div class="max-w-[90%] sm:max-w-[80%] rounded-2xl rounded-bl-sm px-4 py-2.5 bg-white dark:bg-tg-darkBubbleIn text-slate-800 dark:text-slate-100 shadow-sm">
                            <div class="md-content text-sm sm:text-[15px] break-words">${renderedHtml}</div>
                            ${sourcesHtml}
                            <div class="flex items-center justify-between gap-3 mt-2 pt-1">
                                <button
                                    type="button"
                                    class="copy-msg-btn inline-flex items-center gap-1 text-[11px] text-slate-400 hover:text-tg-blue dark:hover:text-sky-400 transition cursor-pointer py-0.5"
                                    title="Javobni nusxalash"
                                >
                                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/>
                                    </svg>
                                    <span>Nusxalash</span>
                                </button>
                                <span class="text-[10px] text-slate-400 dark:text-slate-500">${formatTime(msg.timestamp)}</span>
                            </div>
                        </div>
                    `;

                    const copyBtn = row.querySelector(".copy-msg-btn");
                    copyBtn.addEventListener("click", () => {
                        copyToClipboard(msg.text, "AI javobi nusxalandi!");
                    });
                }

                els.messagesInner.appendChild(row);
            });

            // Agar AI javob yozayotgan bo'lsa — 3 nuqta animatsiyali indikator
            if (state.isGenerating) {
                const typingRow = document.createElement("div");
                typingRow.className = "flex justify-start w-full msg-animate";
                typingRow.innerHTML = `
                    <div class="rounded-2xl rounded-bl-sm px-4 py-3.5 bg-white dark:bg-tg-darkBubbleIn shadow-sm flex items-center gap-1.5">
                        <span class="w-2 h-2 rounded-full bg-tg-blue dark:bg-sky-400 typing-dot"></span>
                        <span class="w-2 h-2 rounded-full bg-tg-blue dark:bg-sky-400 typing-dot"></span>
                        <span class="w-2 h-2 rounded-full bg-tg-blue dark:bg-sky-400 typing-dot"></span>
                    </div>
                `;
                els.messagesInner.appendChild(typingRow);
            }

            scrollToBottom();
        }

        function scrollToBottom() {
            requestAnimationFrame(() => {
                els.messagesContainer.scrollTop = els.messagesContainer.scrollHeight;
            });
        }

        function updateSendButtonState() {
            els.sendBtn.disabled = state.isGenerating;
            if (state.isGenerating) {
                els.sendIcon.classList.add("hidden");
                els.sendSpinner.classList.remove("hidden");
            } else {
                els.sendIcon.classList.remove("hidden");
                els.sendSpinner.classList.add("hidden");
            }
        }

        function renderAll() {
            applyTheme();
            updateWebSearchUI();
            updateResponsiveLayout();
            renderChatList();
            renderHeader();
            renderMessages();
            updateSendButtonState();
        }

        // --- CHAT AMALLARI ---
        function createNewChat() {
            const newChat = createChatObject(`Yangi suhbat #${state.chats.length + 1}`);
            state.chats.unshift(newChat);
            state.activeChatId = newChat.id;
            state.mobileView = "chat";
            saveState();
            renderAll();
            els.messageInput.focus();
            showToast("Yangi chat ochildi");
        }

        function deleteChat(chatId) {
            state.chats = state.chats.filter(c => c.id !== chatId);
            if (state.chats.length === 0) {
                const fallback = createChatObject("AI Yordamchi (Universal)", AVATAR_GRADIENTS[0]);
                state.chats.push(fallback);
                state.activeChatId = fallback.id;
            } else if (state.activeChatId === chatId) {
                state.activeChatId = state.chats[0].id;
            }
            saveState();
            renderAll();
            showToast("Chat o'chirildi");
        }

        function clearActiveChat() {
            const chat = getActiveChat();
            if (!chat) return;
            chat.messages = [];
            chat.updatedAt = new Date().toISOString();
            saveState();
            renderAll();
            showToast("Chat tarixi tozalandi");
        }

        // --- GEMINI API BILAN BOG'LANISH (EXPONENTIAL BACKOFF) ---
        async function fetchGeminiResponse(chatMessages, useSearch) {
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent?key=${apiKey}`;

            // Oxirgi 20 ta xabarni kontekst sifatida yuborish
            const recentMessages = chatMessages.slice(-20);
            const contents = recentMessages.map(m => ({
                role: m.role === "user" ? "user" : "model",
                parts: [{ text: m.text }]
            }));

            const payload = {
                contents,
                systemInstruction: {
                    parts: [{ text: SYSTEM_INSTRUCTION }]
                }
            };

            if (useSearch) {
                payload.tools = [{ google_search: {} }];
            }

            const maxRetries = 4;
            let delay = 1000;

            for (let attempt = 0; attempt <= maxRetries; attempt++) {
                try {
                    const response = await fetch(apiUrl, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(payload)
                    });

                    if (!response.ok) {
                        if ((response.status === 429 || response.status >= 500) && attempt < maxRetries) {
                            await new Promise(res => setTimeout(res, delay));
                            delay *= 2;
                            continue;
                        }
                        throw new Error(`HTTP ${response.status}`);
                    }

                    const result = await response.json();
                    const candidate = result?.candidates?.[0];
                    const text = candidate?.content?.parts?.map(p => p.text || "").join("") || "";

                    if (!text) {
                        throw new Error("Bo'sh javob");
                    }

                    // Agar Google Search ishlatilgan bo'lsa, manbalarni ajratib olish
                    let sources = [];
                    const groundingMetadata = candidate?.groundingMetadata;
                    if (groundingMetadata?.groundingChunks) {
                        sources = groundingMetadata.groundingChunks
                            .map(chunk => ({
                                uri: chunk.web?.uri,
                                title: chunk.web?.title
                            }))
                            .filter(s => s.uri && s.title);
                    } else if (groundingMetadata?.groundingAttributions) {
                        sources = groundingMetadata.groundingAttributions
                            .map(attr => ({
                                uri: attr.web?.uri,
                                title: attr.web?.title
                            }))
                            .filter(s => s.uri && s.title);
                    }

                    // Takroriy manbalarni olib tashlash
                    const uniqueSources = [];
                    const seenUris = new Set();
                    for (const s of sources) {
                        if (!seenUris.has(s.uri)) {
                            seenUris.add(s.uri);
                            uniqueSources.push(s);
                        }
                    }

                    return { text, sources: uniqueSources };
                } catch (err) {
                    if (attempt < maxRetries) {
                        await new Promise(res => setTimeout(res, delay));
                        delay *= 2;
                        continue;
                    }
                    throw err;
                }
            }
        }

        // --- XABAR YUBORISH ---
        async function sendMessage(overrideText = null) {
            if (state.isGenerating) return;

            const text = (overrideText !== null ? overrideText : els.messageInput.value).trim();
            if (!text) return;

            const chat = getActiveChat();
            if (!chat) return;

            // Agar yangi chatda birinchi xabar bo'lsa, sarlavhani avtomatik nomlash
            if (chat.messages.length === 0 && chat.title.startsWith("Yangi suhbat")) {
                chat.title = text.length > 32 ? text.slice(0, 32) + "..." : text;
            }

            // Foydalanuvchi xabarini qo'shish
            const userMsg = {
                id: generateId(),
                role: "user",
                text,
                timestamp: new Date().toISOString()
            };
            chat.messages.push(userMsg);
            chat.updatedAt = userMsg.timestamp;

            // Inputni tozalash
            if (overrideText === null) {
                els.messageInput.value = "";
                autoResizeTextarea();
            }

            state.isGenerating = true;
            saveState();
            renderChatList();
            renderHeader();
            renderMessages();
            updateSendButtonState();

            try {
                const { text: aiText, sources } = await fetchGeminiResponse(chat.messages, state.webSearch);

                const aiMsg = {
                    id: generateId(),
                    role: "model",
                    text: aiText,
                    sources,
                    timestamp: new Date().toISOString()
                };
                chat.messages.push(aiMsg);
                chat.updatedAt = aiMsg.timestamp;
            } catch (error) {
                const errorMsg = {
                    id: generateId(),
                    role: "model",
                    text: "Kechirasiz, javob olishda vaqtinchalik texnik xatolik yuz berdi. Iltimos, birozdan so'ng qayta urinib ko'ring.",
                    timestamp: new Date().toISOString()
                };
                chat.messages.push(errorMsg);
                chat.updatedAt = errorMsg.timestamp;
                showToast("Aloqa xatoligi yuz berdi");
            } finally {
                state.isGenerating = false;
                saveState();
                renderChatList();
                renderHeader();
                renderMessages();
                updateSendButtonState();
            }
        }

        // Textarea balandligini matnga qarab moslash
        function autoResizeTextarea() {
            els.messageInput.style.height = "auto";
            els.messageInput.style.height = Math.min(els.messageInput.scrollHeight, 144) + "px";
        }

        // --- HODISALARNI ULASH (EVENT LISTENERS) ---
        function bindEvents() {
            // Yangi chat
            els.newChatBtn.addEventListener("click", createNewChat);

            // Qidiruv
            els.searchInput.addEventListener("input", (e) => {
                state.searchQuery = e.target.value;
                els.clearSearchBtn.classList.toggle("hidden", !state.searchQuery);
                renderChatList();
            });

            els.clearSearchBtn.addEventListener("click", () => {
                state.searchQuery = "";
                els.searchInput.value = "";
                els.clearSearchBtn.classList.add("hidden");
                renderChatList();
                els.searchInput.focus();
            });

            // Mobil orqaga qaytish tugmasi
            els.mobileBackBtn.addEventListener("click", () => {
                state.mobileView = "list";
                updateResponsiveLayout();
            });

            // Web Search toggle
            els.webSearchToggle.addEventListener("click", () => {
                state.webSearch = !state.webSearch;
                saveState();
                updateWebSearchUI();
                showToast(state.webSearch ? "Internetdan qidirish yoqildi" : "Internetdan qidirish o'chirildi");
            });

            // Kun / Tun rejimi
            els.themeToggleBtn.addEventListener("click", () => {
                state.theme = state.theme === "dark" ? "light" : "dark";
                saveState();
                applyTheme();
            });

            // Chatni tozalash
            els.clearChatBtn.addEventListener("click", () => {
                const chat = getActiveChat();
                if (!chat || chat.messages.length === 0) {
                    showToast("Chat allaqachon bo'sh");
                    return;
                }
                openConfirmModal(
                    "Chatni tozalash",
                    "Ushbu chatdagi barcha xabarlar tarixini tozalamoqchimisiz?",
                    "Tozalash",
                    clearActiveChat
                );
            });

            // Modal tugmalari
            els.modalCancelBtn.addEventListener("click", closeConfirmModal);
            els.confirmModal.addEventListener("click", (e) => {
                if (e.target === els.confirmModal) closeConfirmModal();
            });
            els.modalConfirmBtn.addEventListener("click", () => {
                if (typeof state.pendingModalAction === "function") {
                    state.pendingModalAction();
                }
                closeConfirmModal();
            });

            // Xabar yuborish
            els.sendBtn.addEventListener("click", () => sendMessage());
            els.messageInput.addEventListener("input", autoResizeTextarea);
            els.messageInput.addEventListener("keydown", (e) => {
                if (e.key === "Enter" && !e.shiftKey) {
                    e.preventDefault();
                    sendMessage();
                }
            });

            // Ekran o'lchami o'zgarganda responsive holatni yangilash
            window.addEventListener("resize", updateResponsiveLayout);
        }

        // --- ILOVANI ISHGA TUSHIRISH ---
        window.addEventListener("DOMContentLoaded", () => {
            loadState();
            bindEvents();
            renderAll();
        });
    </script>
</body>
